server {
    listen 80;
    listen [::]:80;
    server_name docs.everlasting.xin;

    root /www/sites/docs.everlasting.xin/current;
    index index.html;

    access_log /var/log/nginx/docs.everlasting.xin.access.log main;
    error_log /var/log/nginx/docs.everlasting.xin.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/docs.everlasting.xin/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location ~* /search/search_index\.json$ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:xml|json|txt)$ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
