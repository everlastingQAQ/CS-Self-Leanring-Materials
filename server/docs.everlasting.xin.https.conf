server {
    listen 80;
    listen [::]:80;
    server_name docs.everlasting.xin;

    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/docs.everlasting.xin/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docs.everlasting.xin;

    root /www/sites/docs.everlasting.xin/current;
    index index.html;

    ssl_certificate /www/sites/docs.everlasting.xin/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/docs.everlasting.xin/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:docs_everlasting_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/docs.everlasting.xin.access.log main;
    error_log /var/log/nginx/docs.everlasting.xin.error.log warn;

    location ~ /\. {
        deny all;
    }

    location = /about {
        return 301 https://$host/CS61B/2021Spring/about/;
    }

    location = /about/ {
        return 301 https://$host/CS61B/2021Spring/about/;
    }

    location = /chapters {
        return 301 https://$host/CS61B/2021Spring/;
    }

    location = /chapters/ {
        return 301 https://$host/CS61B/2021Spring/;
    }

    location ^~ /chapters/ {
        return 301 https://$host/CS61B/2021Spring$request_uri;
    }

    location ~* /search/search_index\.json$ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:xml|json|txt)$ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
